<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Plus Physio — Performance Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --ink:#1d1d1f; --muted:#86868b; --faint:#a1a1a6;
      --line:#ececef; --bg:#fbfbfd; --panel:#ffffff; --hover:#f5f5f7;
      --bad:#d23a31; --bad-bg:#fcefee; --good:#1a8f5c; --good-bg:#e9f6ef; --accent:#8a8a8e;
    }
    * { box-sizing:border-box; }
    html,body { -webkit-font-smoothing:antialiased; }
    body { margin:0; background:var(--bg); color:var(--ink);
           font-family:"Inter",-apple-system,BlinkMacSystemFont,sans-serif;
           line-height:1.5; letter-spacing:-0.01em; }

    .wrap { max-width:960px; margin:0 auto; padding:56px 24px 64px; }

    h1 { font-size:28px; font-weight:600; letter-spacing:-0.02em; margin:0 0 2px; }
    .subtitle { color:var(--muted); font-size:15px; margin:0 0 24px; }

    /* Period toggle */
    .toggle { display:flex; gap:6px; margin-bottom:10px; }
    .toggle button {
      padding:7px 16px; border-radius:999px; border:1px solid var(--line);
      background:var(--panel); color:var(--muted); font-size:13px; font-weight:500;
      cursor:pointer; font-family:inherit; transition:all .15s ease;
    }
    .toggle button:hover { border-color:var(--accent); color:var(--ink); }
    .toggle button.active { background:var(--ink); border-color:var(--ink); color:#fff; }
    .period-meta { color:var(--muted); font-size:13px; margin:0 0 32px; }

    /* Section labels */
    .section-label {
      font-size:11px; font-weight:600; text-transform:uppercase;
      letter-spacing:.06em; color:var(--faint); margin:32px 0 10px;
    }
    .platform-label { font-size:13px; font-weight:600; color:var(--muted); margin-bottom:8px; }

    /* Panel */
    .panel {
      background:var(--panel); border:1px solid var(--line);
      border-radius:16px; overflow:hidden;
      box-shadow:0 1px 2px rgba(0,0,0,.03);
    }

    /* KPI row */
    .kpi-row { display:flex; padding:24px 24px 20px; }
    .kpi { flex:1; padding:0 20px; border-right:1px solid var(--line); }
    .kpi:first-child { padding-left:0; }
    .kpi:last-child  { border-right:none; }
    .kpi-label { font-size:11px; font-weight:600; text-transform:uppercase;
                 letter-spacing:.04em; color:var(--faint); margin-bottom:6px; }
    .kpi-value { font-size:26px; font-weight:600; letter-spacing:-0.02em;
                 font-variant-numeric:tabular-nums; line-height:1.2; }
    .kpi-delta { font-size:13px; margin-top:5px; }

    /* Delta colour helpers */
    .delta-up        { color:var(--good); }
    .delta-down      { color:var(--bad); }
    .delta-flat      { color:var(--faint); }
    .delta-cost-up   { color:var(--bad); }
    .delta-cost-down { color:var(--good); }

    /* Conversion breakdown table */
    .bkdn { width:100%; border-collapse:collapse; font-size:14px; }
    .bkdn th {
      padding:10px 24px; border-top:1px solid var(--line); text-align:left;
      font-size:10px; font-weight:600; text-transform:uppercase;
      letter-spacing:.04em; color:var(--faint);
    }
    .bkdn th.r, .bkdn td.r { text-align:right; font-variant-numeric:tabular-nums; }
    .bkdn td { padding:11px 24px; border-top:1px solid var(--line); }

    /* Ads 2-column grid */
    .ads-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }

    /* GSC strip */
    .gsc-strip { display:flex; padding:20px 24px; }
    .gsc-kpi { flex:1; padding:0 16px; border-right:1px solid var(--line); }
    .gsc-kpi:first-child { padding-left:0; }
    .gsc-kpi:last-child  { border-right:none; }
    .gsc-label { font-size:11px; font-weight:600; text-transform:uppercase;
                 letter-spacing:.04em; color:var(--faint); margin-bottom:4px; }
    .gsc-value { font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-0.02em; }
    .gsc-delta { font-size:12px; margin-top:3px; }

    /* GA4 sessions strip */
    .sess-strip { display:flex; padding:20px 24px; border-bottom:1px solid var(--line); }
    .sess-item { flex:1; padding:0 16px; border-right:1px solid var(--line); }
    .sess-item:first-child { padding-left:0; }
    .sess-item:last-child  { border-right:none; }
    .sess-label { font-size:11px; font-weight:600; text-transform:uppercase;
                  letter-spacing:.04em; color:var(--faint); margin-bottom:4px; }
    .sess-value { font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-0.02em; }
    .sess-delta { font-size:12px; margin-top:3px; }

    /* Key events pill list */
    .conv-list { display:flex; flex-wrap:wrap; gap:8px; padding:16px 24px 20px;
                 border-bottom:1px solid var(--line); }
    .conv-item { display:inline-flex; align-items:center; gap:6px; padding:6px 14px;
                 background:var(--hover); border-radius:999px; font-size:13px; }
    .conv-item b { font-weight:600; color:var(--ink); margin-right:2px; }
    .conv-item span { color:var(--muted); }

    /* Charts row */
    .charts-row { display:flex; padding:24px; border-bottom:1px solid var(--line); gap:0; }
    .chart-col-main { flex:1; min-width:0; padding-right:24px;
                      border-right:1px solid var(--line); }
    .chart-col-side { flex:0 0 200px; padding-left:24px; }
    .chart-title { font-size:11px; font-weight:600; text-transform:uppercase;
                   letter-spacing:.04em; color:var(--faint); margin-bottom:14px; }

    /* Top pages table */
    .pages-table { width:100%; border-collapse:collapse; font-size:14px; }
    .pages-table th {
      padding:12px 24px; border-bottom:1px solid var(--line); text-align:left;
      font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--faint);
    }
    .pages-table th.r, .pages-table td.r { text-align:right; font-variant-numeric:tabular-nums; }
    .pages-table td { padding:11px 24px; border-bottom:1px solid var(--line); }
    .pages-table tr:last-child td { border-bottom:none; }
    .page-path { font-family:ui-monospace,SFMono-Regular,monospace; font-size:13px; color:var(--muted); }

    .foot { color:var(--faint); font-size:12px; margin-top:32px; text-align:center; }
  </style>
</head>
<body>
<div class="wrap">

  <h1>A Plus Physio</h1>
  <p class="subtitle">Performance Dashboard</p>

  <div class="toggle">
    <button id="btn-last_30_days" class="active" onclick="setPeriod('last_30_days')">Last 30 Days</button>
    <button id="btn-last_month"                  onclick="setPeriod('last_month')">Last Month</button>
  </div>
  <p class="period-meta" id="period-meta"></p>

  <!-- PAID ADVERTISING -->
  <div class="section-label">Paid Advertising</div>
  <div class="ads-grid">
    <div>
      <div class="platform-label">Google Ads</div>
      <div class="panel">
        <div class="kpi-row" id="gads-kpis"></div>
        <div id="gads-breakdown"></div>
      </div>
    </div>
    <div>
      <div class="platform-label">Meta Ads</div>
      <div class="panel">
        <div class="kpi-row" id="meta-kpis"></div>
        <div id="meta-breakdown"></div>
      </div>
    </div>
  </div>

  <!-- ORGANIC SEARCH -->
  <div class="section-label">Organic Search</div>
  <div class="panel">
    <div class="gsc-strip" id="gsc-strip"></div>
  </div>

  <!-- WEBSITE ANALYTICS -->
  <div class="section-label">Website Analytics</div>
  <div class="panel">
    <div class="sess-strip"  id="ga4-sessions"></div>
    <div class="kpi-row"     id="ga4-kpis"></div>
    <div                     id="ga4-conv-list"></div>
    <div class="charts-row">
      <div class="chart-col-main">
        <div class="chart-title">Traffic by Channel</div>
        <canvas id="channelChart" height="160"></canvas>
      </div>
      <div class="chart-col-side">
        <div class="chart-title">By Device</div>
        <canvas id="deviceChart" height="160"></canvas>
      </div>
    </div>
    <table class="pages-table">
      <thead>
        <tr>
          <th>Top Pages</th>
          <th class="r">Views</th>
          <th class="r">Share</th>
        </tr>
      </thead>
      <tbody id="pages-tbody"></tbody>
    </table>
  </div>

  <p class="foot" id="foot"></p>

</div>
<script>
/* ─── state ─── */
let data   = null;
let charts = { channel: null, device: null };

/* ─── formatters ─── */
const aud = n => '$' + Math.round(n).toLocaleString('en-AU');
const num = n => Math.round(n).toLocaleString('en-AU');
const pct = n => Math.round(n * 100) + '%';
const dur = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

function delta(curr, prev, higherIsBetter) {
  if (!prev) return { cls: 'delta-flat', str: '—' };
  const d   = (curr - prev) / prev;
  const str = (d >= 0 ? '↑ +' : '↓ ') + Math.round(d * 100) + '%';
  if (Math.abs(d) < 0.005) return { cls: 'delta-flat', str };
  if (d > 0) return { cls: higherIsBetter ? 'delta-up'   : 'delta-cost-up',   str };
             return { cls: higherIsBetter ? 'delta-down' : 'delta-cost-down', str };
}

function kpiHTML(label, value, d) {
  return `<div class="kpi">
    <div class="kpi-label">${label}</div>
    <div class="kpi-value">${value}</div>
    <div class="kpi-delta ${d.cls}">${d.str}</div>
  </div>`;
}

/* ─── render: Google Ads ─── */
function renderGoogleAds(g) {
  document.getElementById('gads-kpis').innerHTML =
    kpiHTML('Spend',       aud(g.spend.current),       delta(g.spend.current,       g.spend.previous,       true))  +
    kpiHTML('Conversions', num(g.conversions.current), delta(g.conversions.current, g.conversions.previous, true))  +
    kpiHTML('Cost / conv', aud(g.cpa.current),         delta(g.cpa.current,         g.cpa.previous,         false));

  let bkdn = '';
  if (g.conversion_breakdown && g.conversion_breakdown.length) {
    bkdn = '<table class="bkdn"><thead><tr><th>Conversion type</th><th class="r">Count</th></tr></thead><tbody>';
    g.conversion_breakdown.forEach(r => { bkdn += `<tr><td>${r.name}</td><td class="r">${r.value}</td></tr>`; });
    bkdn += '</tbody></table>';
  }
  document.getElementById('gads-breakdown').innerHTML = bkdn;
}

/* ─── render: Meta Ads ─── */
function renderMetaAds(m) {
  document.getElementById('meta-kpis').innerHTML =
    kpiHTML('Spend',       aud(m.spend.current),       delta(m.spend.current,       m.spend.previous,       true))  +
    kpiHTML('Conversions', num(m.conversions.current), delta(m.conversions.current, m.conversions.previous, true))  +
    kpiHTML('Cost / conv', aud(m.cpa.current),         delta(m.cpa.current,         m.cpa.previous,         false));

  let bkdn = '';
  if (m.conversion_breakdown && m.conversion_breakdown.length) {
    bkdn = '<div class="conv-list">';
    m.conversion_breakdown.forEach(e => {
      bkdn += `<div class="conv-item"><b>${e.value.toLocaleString('en-AU')}</b><span>${e.name}</span></div>`;
    });
    bkdn += '</div>';
  }
  document.getElementById('meta-breakdown').innerHTML = bkdn;
}

/* ─── render: GSC ─── */
function renderGSC(g) {
  function gscKpi(label, value, d) {
    return `<div class="gsc-kpi">
      <div class="gsc-label">${label}</div>
      <div class="gsc-value">${value}</div>
      <div class="gsc-delta ${d.cls}">${d.str}</div>
    </div>`;
  }
  document.getElementById('gsc-strip').innerHTML =
    gscKpi('Clicks',       num(g.clicks.current),
           delta(g.clicks.current,         g.clicks.previous,         true))  +
    gscKpi('Impressions',  num(g.impressions.current),
           delta(g.impressions.current,     g.impressions.previous,    true))  +
    gscKpi('Avg Position', g.avg_position.current > 0 ? g.avg_position.current.toFixed(1) : '—',
           delta(g.avg_position.current,    g.avg_position.previous,   false)) +
    gscKpi('Keywords',     num(g.total_keywords.current),
           delta(g.total_keywords.current,  g.total_keywords.previous, true))  +
    gscKpi('Ranked Pages', num(g.ranked_pages.current),
           delta(g.ranked_pages.current,    g.ranked_pages.previous,   true));
}

/* ─── render: GA4 ─── */
function renderGA4(g) {
  /* sessions strip */
  function sessItem(label, value, d) {
    return `<div class="sess-item">
      <div class="sess-label">${label}</div>
      <div class="sess-value">${value}</div>
      <div class="sess-delta ${d.cls}">${d.str}</div>
    </div>`;
  }
  document.getElementById('ga4-sessions').innerHTML =
    sessItem('Sessions',  num(g.sessions_total.current),
             delta(g.sessions_total.current,     g.sessions_total.previous,     true)) +
    sessItem('New',       num(g.sessions_new.current),
             delta(g.sessions_new.current,       g.sessions_new.previous,       true)) +
    sessItem('Returning', num(g.sessions_returning.current),
             delta(g.sessions_returning.current, g.sessions_returning.previous, true));

  /* main KPIs */
  document.getElementById('ga4-kpis').innerHTML =
    kpiHTML('Conversions', num(g.conversions.current),
            delta(g.conversions.current, g.conversions.previous, true)) +
    kpiHTML('Avg Session', g.avg_session_duration_seconds > 0 ? dur(g.avg_session_duration_seconds) : '—',
            { cls: 'delta-flat', str: '' }) +
    kpiHTML('Engagement',  g.engagement_rate > 0 ? pct(g.engagement_rate) : '—',
            { cls: 'delta-flat', str: '' });

  /* key events */
  let evHTML = '<div class="conv-list">';
  (g.conversion_breakdown || []).forEach(e => {
    evHTML += `<div class="conv-item"><b>${e.value}</b><span>${e.name}</span></div>`;
  });
  evHTML += '</div>';
  document.getElementById('ga4-conv-list').innerHTML = evHTML;

  /* charts — destroy previous instances */
  Object.values(charts).forEach(c => c && c.destroy());
  charts = { channel: null, device: null };

  if (g.traffic_by_channel && g.traffic_by_channel.length) {
    charts.channel = new Chart(document.getElementById('channelChart'), {
      type: 'bar',
      data: {
        labels: g.traffic_by_channel.map(r => r.channel),
        datasets: [{ data: g.traffic_by_channel.map(r => r.sessions),
                     backgroundColor: '#1d1d1f', borderRadius: 4, borderSkipped: false }]
      },
      options: {
        indexAxis: 'y',
        plugins: { legend: { display: false },
                   tooltip: { callbacks: { label: ctx => ' ' + ctx.raw + ' sessions' } } },
        scales: {
          x: { grid: { color: '#ececef' }, ticks: { color: '#86868b', font: { size: 11 } } },
          y: { grid: { display: false },   ticks: { color: '#1d1d1f', font: { size: 12 } } }
        }
      }
    });
  }

  if (g.traffic_by_device && g.traffic_by_device.length) {
    charts.device = new Chart(document.getElementById('deviceChart'), {
      type: 'doughnut',
      data: {
        labels: g.traffic_by_device.map(r => r.device),
        datasets: [{ data: g.traffic_by_device.map(r => r.sessions),
                     backgroundColor: ['#1d1d1f', '#86868b', '#ececef'],
                     borderWidth: 0 }]
      },
      options: {
        cutout: '68%',
        plugins: {
          legend: { position: 'bottom',
                    labels: { color: '#86868b', font: { size: 11 }, padding: 10 } },
          tooltip: { callbacks: { label: ctx => ' ' + ctx.raw + ' sessions' } }
        }
      }
    });
  }

  /* top pages */
  let rows = '';
  (g.top_pages || []).slice(0, 10).forEach(p => {
    rows += `<tr>
      <td class="page-path">${p.page}</td>
      <td class="r">${num(p.views)}</td>
      <td class="r">${p.share.toFixed(1)}%</td>
    </tr>`;
  });
  document.getElementById('pages-tbody').innerHTML = rows;
}

/* ─── period switch ─── */
function setPeriod(key) {
  document.querySelectorAll('.toggle button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + key).classList.add('active');
  const p = data[key];
  document.getElementById('period-meta').textContent =
    p.period_label + (p.comparison_label ? ' · vs ' + p.comparison_label : '');
  renderGoogleAds(p.google_ads);
  renderMetaAds(p.meta_ads);
  renderGSC(p.gsc);
  renderGA4(p.ga4);
}

/* ─── bootstrap ─── */
async function init() {
  try {
    const resp = await fetch('data/latest.json');
    data = await resp.json();
    const d = new Date(data.meta.updated_at);
    document.getElementById('foot').textContent =
      'Data from Google Ads, Meta Ads, GA4 & Search Console · Updated ' +
      d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
    setPeriod('last_30_days');
  } catch(e) {
    document.getElementById('foot').textContent =
      'Run a local server to preview: python3 -m http.server 8000';
    console.error(e);
  }
}

init();
</script>
</body>
</html>
